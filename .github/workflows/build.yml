name: Build CBT Android APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed Release AAB (butuh keystore secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ── Job 1: Debug APK — selalu jalan, tidak perlu keystore ─────────────────
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CBT-EDU-TimurKasuari-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ── Job 2: Release AAB — hanya jalan saat dipilih manual via workflow_dispatch
  build-release-aab:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/edukasuari.keystore

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: edukasuari.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: CBT-EDU-TimurKasuari-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90
